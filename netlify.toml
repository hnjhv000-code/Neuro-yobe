# Netlify Configuration for Yassa Tube SPA
[build]
  publish = "dist"
  command = "npm run build"

# Single Page Application (SPA) routing rule
# Ensures refreshing or direct URLs (e.g. ?v=xxx or deep links) load index.html without 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# High performance caching headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://googleads.g.doubleclick.net https://accounts.google.com/gsi/ https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; media-src 'self' https: data: blob:; connect-src 'self' https: wss: data: blob: https://*.firebasedatabase.app https://*.firebaseio.com https://accounts.google.com https://pagead2.googlesyndication.com; frame-src 'self' https: http:; object-src 'none'; base-uri 'self';"
