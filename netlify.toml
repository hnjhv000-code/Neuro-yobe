# Netlify Configuration for Yassa Tube SPA
[build]
  publish = "dist"
  command = "npm run build"

# Single Page Application (SPA) routing rule
# Ensures refreshing or direct URLs (e.g. ?v=xxx or deep links) load index.html without 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# High performance caching headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
